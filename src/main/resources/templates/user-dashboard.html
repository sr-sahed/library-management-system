<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand">📖 Student Dashboard (<span th:text="${username}">User</span>)</span>
    <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
</nav>

<div class="container mt-4">
    <!-- Search Bar -->
    <form th:action="@{/search}" method="get" class="input-group mb-3">
        <input type="text" name="keyword" placeholder="Search by book title or author..." class="form-control" required>
        <button type="submit" class="btn btn-outline-primary">Search</button>
        <a href="/user-dashboard" class="btn btn-outline-secondary">Reset</a>
    </form>
    <!-- Available Books to Borrow -->
    <div class="card p-4 mb-4 shadow-sm">
        <h4>Available Books in Library</h4>
        <table class="table table-striped mt-2">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Available Stock</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="b : ${books}">
                    <td th:text="${b.title}">Java</td>
                    <td th:text="${b.author}">Author</td>
                    <td th:text="${b.availableQuantity}">5</td>
                    <td>
                        <a th:if="${b.availableQuantity > 0}" th:href="@{/user/borrow/{id}(id=${b.id})}" class="btn btn-sm btn-primary">Borrow</a>
                        <span th:if="${b.availableQuantity == 0}" class="text-danger fw-bold">Out of Stock</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- My Borrowed Books History -->
    <div class="card p-4 shadow-sm">
        <h4>My Borrowed Books History</h4>
        <table class="table table-bordered mt-2">
            <thead>
                <tr>
                    <th>Book Title</th>
                    <th>Borrow Date</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${myRecords}">
                    <td th:text="${r.bookTitle}">Java</td>
                    <td th:text="${r.borrowDate}">2026-09-18</td>
                    <td>
                        <span th:text="${r.status}" th:class="${r.status == 'BORROWED'} ? 'badge bg-warning text-dark' : 'badge bg-success'"></span>
                    </td>
                    <td>
                        <a th:if="${r.status == 'BORROWED'}" th:href="@{/return/{id}(id=${r.id})}" class="btn btn-sm btn-danger">Return</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

</body>
</html>
